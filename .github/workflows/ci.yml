# ScreenFoundry's checks: on every push to main and every pull request, the gate contributors run
# before committing, `cargo xtask ci` (fmt, clippy -D warnings, tests, assets, brands, layers,
# wasm). The other workflows in this folder are VectorCraft's and only run in its repository.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # No debug info, so target/ fits the runner's disk.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUST_BACKTRACE: 1

jobs:
  ci:
    name: cargo xtask ci
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space
        # The workspace's build outputs need more room than the runner leaves free.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install build dependencies
        run: |
          # Ubuntu-host DNS outage 2026-11-11: on GitHub's x64 Ubuntu runners, try mirrors.kernel.org first, then Azure.
          if [ -f /etc/apt/apt-mirrors.txt ] && [ "$(dpkg --print-architecture)" = amd64 ]; then
            printf "http://mirrors.kernel.org/ubuntu/\nhttp://azure.archive.ubuntu.com/ubuntu/\n" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            sudo sed -i -E "s#https?://(security|archive|azure\.archive)\.ubuntu\.com/ubuntu#http://mirrors.kernel.org/ubuntu#g" /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
          fi
          for i in 1 2 3; do sudo apt-get -o Acquire::Retries=3 update && break; sleep 20; done
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      # The toolchain the code is checked with locally. Each Rust release adds clippy lints, so
      # bump it on purpose and fix what the new lints flag in the same commit.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci
      - name: cargo xtask ci
        run: cargo xtask ci
      - name: Disk left
        if: always()
        run: df -h /
