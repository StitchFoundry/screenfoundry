# Build with: trunk build --release   (from apps/vectorcraft-web)
[build]
target = "index.html"
dist = "../../dist/web"
public_url = "./"
filehash = true
# Size-optimised profile (Cargo.toml [profile.web]); `trunk build --release` still works unchanged.
cargo_profile = "web"

[serve]
addresses = ["127.0.0.1"]
port = 8766

# One hook, not three: Trunk runs separate post_build hooks at the same time, and web-csp and
# web-loading both rewrite the staged index.html, so one could overwrite the other's edit (the page
# shipped with `__SCRIPT_HASHES__` still in its policy). `web-post` runs, in order, web-fonts (copy the
# craft-fonts faces web builds fetch; a no-op without CRAFT_FONTS_DIR), web-csp (fill the content
# security policy with the inline scripts' hashes and check it) and web-loading (write the .wasm's
# size into the loading screen). See xtask/src/web_csp.rs, web_loading.rs, web_fonts.rs.
[[hooks]]
stage = "post_build"
command = "cargo"
command_arguments = ["xtask", "web-post"]
