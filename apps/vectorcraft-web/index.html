<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ScreenFoundry">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#262626">
  <!-- Content security policy (SC-11). __SCRIPT_HASHES__ is replaced, in the built page, by the SHA-256 of each
       inline script Trunk writes (`cargo xtask web-csp`, a Trunk post_build hook); `cargo xtask web-csp --check`
       and the xtask tests fail when a script isn't allowed, which would leave the page blank. connect-src names
       the only other sites the app talks to: MakerFoundry (Publish; Open in ScreenFoundry) and Foundry Account. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' __SCRIPT_HASHES__ 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' data: blob: https://makerfoundry.app https://www.makerfoundry.app https://cloud.stitchfoundry.app https://cloud-staging-staging.up.railway.app https://makerfoundry-test-test.up.railway.app; font-src 'self' data:; worker-src 'self' blob:; frame-src blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>ScreenFoundry</title>
  <meta name="description" content="Screen-printing prepress: artwork in, one film per screen out. Free and open source.">
  <link rel="canonical" href="https://app.screenfoundry.app/">
  <!-- Favicon drawn here: a screen frame with a halftone dot and a squeegee line (original artwork, MIT OR Apache-2.0). -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23262626'/%3E%3Crect x='6' y='6' width='20' height='20' rx='2' fill='none' stroke='%23ffb042' stroke-width='2.5'/%3E%3Ccircle cx='13' cy='13' r='2.4' fill='%23f5f5f5'/%3E%3Ccircle cx='20' cy='13' r='1.4' fill='%23f5f5f5'/%3E%3Ccircle cx='13' cy='20' r='1.4' fill='%23f5f5f5'/%3E%3Ccircle cx='20' cy='20' r='2.4' fill='%23f5f5f5'/%3E%3C/svg%3E">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ScreenFoundry">
  <meta property="og:title" content="ScreenFoundry">
  <meta property="og:description" content="Screen-printing prepress: artwork in, one film per screen out. Free and open source.">
  <meta property="og:url" content="https://app.screenfoundry.app/">
  <meta property="og:image" content="https://app.screenfoundry.app/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link data-trunk rel="copy-file" href="og-image.png" />
  <link data-trunk rel="rust" data-bin="vectorcraft-web" data-wasm-opt="z" data-weak-refs data-initializer="loader.js" />
  <!-- The service worker (cache-first for the content-hashed wasm/js), at the site root so its scope covers the app. -->
  <link data-trunk rel="copy-file" href="sw.js" />
  <style>
    /* iPad: no page scroll, bounce, pinch zoom, text selection or callout; the app takes the gestures. */
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #262626;
      overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
    /* Inside the safe areas (notch, home indicator) of a full-screen app. */
    #vectorcraft_canvas { position: absolute; top: env(safe-area-inset-top, 0); right: env(safe-area-inset-right, 0);
      bottom: env(safe-area-inset-bottom, 0); left: env(safe-area-inset-left, 0);
      width: calc(100% - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
      height: calc(100% - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
      display: block; touch-action: none; }
    #vectorcraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #b8b8b8; font: 14px system-ui, sans-serif; pointer-events: none; }
    #vectorcraft_loading progress { width: min(320px, 70vw); height: 8px; margin: 14px 0 8px; accent-color: #8ab4f8; }
    #vectorcraft_loading [data-mb] { font-size: 12px; opacity: .8; min-height: 1em; }
  </style>
</head>
<body>
  <canvas id="vectorcraft_canvas"></canvas>
  <div id="vectorcraft_loading" data-wasm-bytes="__WASM_BYTES__">
    <div data-text>Loading ScreenFoundry&hellip;</div>
    <progress></progress>
    <div data-mb></div>
  </div>
</body>
</html>
